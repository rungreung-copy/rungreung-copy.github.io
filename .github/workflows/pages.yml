name: Deploy website

# ทุกครั้งที่ push ขึ้น main: สร้างรายการรูปผลงานจากโฟลเดอร์ images/works แล้วขึ้นเว็บ
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build works manifest
        run: node scripts/build-works-manifest.mjs
      - name: Pre-render shop info, prices and JSON-LD into HTML
        run: node scripts/prerender.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
